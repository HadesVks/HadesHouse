<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hades House | Centro de Pagos & Billetera Real 🇩🇴</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme rd-style">
    <div class="flag-bar"></div>
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo-brand">
                <img src="logo.jpg" alt="Hades House Logo" class="brand-logo-img">
                <div class="logo-text-group">
                    <span class="logo-text">HADES <span class="accent-text">HOUSE</span></span>
                    <span class="logo-subtext">BILLETERA OFICIAL</span>
                </div>
                <span class="badge-official">OFICIAL RD 🇩🇴</span>
            </a>
            <nav class="nav-categories">
                <a href="index.html" class="cat-btn"><i class="fa-solid fa-house"></i> Inicio / Deportes</a>
                <a href="sorteos.html" class="cat-btn"><i class="fa-solid fa-ticket"></i> Sorteos & Palé</a>
                <a href="casino.html" class="cat-btn highlight-casino"><i class="fa-solid fa-dice"></i> Casino Virtual</a>
                <a href="billetera.html" class="cat-btn active"><i class="fa-solid fa-wallet"></i> Billetera Real</a>
            </nav>
            <div class="wallet-widget">
                <div class="auth-buttons-guest" id="guest-auth-block">
                    <button class="btn-secondary-header" id="btn-open-login"><i class="fa-solid fa-arrow-right-to-bracket"></i> Iniciar Sesión</button>
                    <button class="btn-primary-header" id="btn-open-register"><i class="fa-solid fa-user-plus"></i> Abrir Cuenta</button>
                </div>
                <div class="user-logged-block hidden" id="user-logged-block">
                    <div class="balance-display">
                        <span class="balance-label">BILLETERA OFICIAL</span>
                        <span class="balance-amount" id="user-balance">RD$ 0.00</span>
                    </div>
                    <button class="btn-deposit" id="btn-open-deposit"><i class="fa-solid fa-wallet"></i> Depósitos / Retiros</button>
                </div>
            </div>
        </div>
    </header>

    <main class="app-layout" style="grid-template-columns: 1fr; max-width: 600px;">
        <section class="main-content">
            <div class="section-header">
                <h1 class="page-title"><i class="fa-solid fa-building-columns"></i> Centro de Pagos & Billetera Real</h1>
            </div>
            
            <div class="modal-card modal-payment-card" style="margin: 20px auto; max-width: 100%;">
                <div class="payment-tabs-switcher">
                    <button class="payment-tab-btn active" id="tab-pay-deposit">
                        <i class="fa-solid fa-arrow-down-left-and-arrow-up-right"></i> Depositar Fondos
                    </button>
                    <button class="payment-tab-btn" id="tab-pay-withdraw">
                        <i class="fa-solid fa-hand-holding-dollar"></i> Retirar Ganancias
                    </button>
                </div>

                <div class="payment-section-content" id="section-pay-deposit">
                    <div class="payment-method-selector">
                        <label>Seleccione el Método de Pago:</label>
                        <div class="methods-grid">
                            <button class="method-btn active" data-method="card">
                                <i class="fa-solid fa-credit-card"></i> Tarjeta RD$
                            </button>
                            <button class="method-btn" data-method="bank">
                                <i class="fa-solid fa-building-columns"></i> Banco RD
                            </button>
                            <button class="method-btn" data-method="crypto">
                                <i class="fa-brands fa-bitcoin"></i> USDT Cripto
                            </button>
                        </div>
                    </div>

                    <form id="form-deposit-card" class="payment-subform">
                        <div class="form-group">
                            <label>Monto a Depositar (RD$)</label>
                            <input type="number" id="dep-card-amount" value="1000" min="100" step="100" required>
                        </div>
                        <div class="form-group">
                            <label>Número de Tarjeta</label>
                            <input type="text" id="dep-card-number" placeholder="4532 •••• •••• 8892" maxlength="19" required>
                        </div>
                        <button type="submit" class="btn-primary full-width margin-top-12">
                            <i class="fa-solid fa-lock"></i> Procesar Depósito Seguro
                        </button>
                    </form>

                    <form id="form-deposit-bank" class="payment-subform hidden">
                        <div class="form-group">
                            <label>Monto Transferido (RD$)</label>
                            <input type="number" id="dep-bank-amount" value="2000" min="500" required>
                        </div>
                        <div class="form-group">
                            <label>Número de Confirmación Bancaria</label>
                            <input type="text" id="dep-bank-ref" placeholder="Ej: REF-99201827" required>
                        </div>
                        <button type="submit" class="btn-primary full-width margin-top-12">
                            <i class="fa-solid fa-file-invoice-dollar"></i> Validar Transferencia
                        </button>
                    </form>

                    <form id="form-deposit-crypto" class="payment-subform hidden">
                        <div class="form-group">
                            <label>Hash TXID</label>
                            <input type="text" id="dep-crypto-txid" placeholder="Paste Hash TXID..." required>
                        </div>
                        <button type="submit" class="btn-primary full-width margin-top-12">
                            <i class="fa-solid fa-bolt"></i> Verificar Cripto
                        </button>
                    </form>
                </div>

                <div class="payment-section-content hidden" id="section-pay-withdraw">
                    <form id="form-withdraw" class="payment-subform">
                        <div class="form-group">
                            <label>Monto a Retirar (RD$)</label>
                            <input type="number" id="with-amount" value="1000" min="500" required>
                        </div>
                        <div class="form-group">
                            <label>Número de Cuenta</label>
                            <input type="text" id="with-account-number" placeholder="Ej: 801928374" required>
                        </div>
                        <button type="submit" class="btn-primary full-width margin-top-12">
                            <i class="fa-solid fa-hand-holding-dollar"></i> Solicitar Retiro
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- MODAL AUTH -->
    <div class="modal-overlay hidden" id="modal-auth">
        <div class="modal-card modal-auth-card">
            <div class="modal-header">
                <h3 id="auth-modal-title"><i class="fa-solid fa-user-shield"></i> Iniciar Sesión</h3>
                <button class="btn-close-modal" id="btn-close-auth">&times;</button>
            </div>
            <div class="modal-body">
                <div class="auth-tabs-switcher">
                    <button class="auth-tab-btn active" id="tab-auth-login">Iniciar Sesión</button>
                    <button class="auth-tab-btn" id="tab-auth-register">Crear Cuenta</button>
                </div>
                <form id="form-login" class="auth-form">
                    <div class="form-group">
                        <label for="login-email">Correo Electrónico</label>
                        <input type="email" id="login-email" placeholder="usuario@correo.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary full-width">Iniciar Sesión</button>
                </form>
                <form id="form-register" class="auth-form hidden">
                    <div class="form-group">
                        <label for="reg-name">Nombre Completo</label>
                        <input type="text" id="reg-name" placeholder="Juan Pérez" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Correo Electrónico</label>
                        <input type="email" id="reg-email" placeholder="usuario@correo.com" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Contraseña</label>
                        <input type="password" id="reg-password" minlength="6" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary full-width">Registrar Cuenta</button>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
