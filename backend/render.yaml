services:
  # Web Service Django (Daphne ASGI + REST API + WebSockets)
  - type: web
    name: hadeshouse-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hadeshouse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hadeshouse-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hadesvks.github.io"

  # Redis In-Memory DB (Broker de WebSockets y Celery)
  - type: redis
    name: hadeshouse-redis
    ipAllowList: []

databases:
  # PostgreSQL Database Real de Producción
  - name: hadeshouse-db
    databaseName: hadeshouse
    user: hadesuser
